name: Transaction Management Fullstack CI/CD

on:
  push:
    branches: [master, develop, feature/**]
  pull_request:

jobs:
  build-and-test:
    name: CI - Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: db_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U admin"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      matrix:
        node: [24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies (npm workspaces)
        run: npm install --no-audit --no-fund --workspaces

      - name: Wait for Postgres
        run: |
          for i in `seq 1 30`; do
            nc -z localhost 5432 && exit 0
            sleep 1
          done
          exit 1

      - name: Build backend
        run: npm run build --workspace backend

      - name: Build frontend
        run: npm run build --workspace frontend

      - name: Run backend migrations
        working-directory: backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: db_test
          PG_USER: admin
          PG_PASSWORD: admin
        run: npx knex migrate:latest

      - name: Run backend seeds
        working-directory: backend
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: db_test
          PG_USER: admin
          PG_PASSWORD: admin
        run: npx knex seed:run

      - name: Run backend tests
        run: npm run test --workspace backend

      - name: Type check frontend
        run: npm run typecheck --workspace frontend

      - name: Lint all workspaces
        run: npm run lint --workspaces